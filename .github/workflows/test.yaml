name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # iverilog for the benches; Verilator and Yosys for make lint warnings;
      # the GNU RISC-V compiler for make gcc (the C self-test built without Zig).
      - name: Install iverilog, Verilator, Yosys and GNU RISC-V GCC
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys gcc-riscv64-unknown-elf

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failed tests in results.xml.
          ! grep -E '<(failure|error)' results.xml

      # Every self-checking suite (make sim fails on the first failed check),
      # zero tool warnings, and the C self-test from a stock GNU toolchain.
      - name: Self-checking suites, lint and the GNU toolchain build
        shell: bash
        run: make -C test sim lint warnings gcc

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
