# gf180-macro — the same plain-pin macro on GlobalFoundries 180 nm
# (gf180mcuD, 5 V 7-track cells), for gf180 shuttles. The RTL has no
# technology cells, so nothing changes but the PDK, the die and the clock.
name = "gf180-macro"
kind = "macro"
summary = "Hard macro on GlobalFoundries gf180mcuD (5 V cells)"
pdk = "gf180mcuD"

[design]
top = "tiqora_macro"
files = ["src/targets/tiqora_macro.sv"]
clock_port = "clk"
# 70 ns, set from a measured routed result: at 60 ns LibreLane 3.0.14 routed
# the macro with setup slack -3.260 ns at max_ss_125C_4v50 on a pin path
# (flop to flop +4.713 ns), targets run 44641297233. Pin delays are 20% of
# the period on each side, so a pin-to-pin path needs 0.6 x period >= 39.3 ns,
# i.e. 65.4 ns; 70 ns adds about 7% margin. The next harden run checks it.
clock_period_ns = 70.0
io_delay_pct = 20

[floorplan]
die_um = [650, 650]
density_pct = 50
max_util_pct = 45

[signoff]
setup_min_ns = 0.0
hold_min_ns = 0.0
max_util_pct = 70

[librelane]
GRT_ADJUSTMENT = 0.15
CTS_SINK_CLUSTERING_SIZE = 10
RUN_POST_GRT_DESIGN_REPAIR = 1
RUN_POST_GRT_RESIZER_TIMING = 1
PL_RESIZER_SETUP_SLACK_MARGIN = 1.0
GRT_RESIZER_SETUP_SLACK_MARGIN = 0.5
PL_RESIZER_HOLD_SLACK_MARGIN = 0.1
GRT_RESIZER_HOLD_SLACK_MARGIN = 0.05
