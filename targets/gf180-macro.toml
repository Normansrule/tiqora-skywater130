# gf180-macro — the same plain-pin macro on GlobalFoundries 180 nm
# (gf180mcuD, 5 V 7-track cells), for gf180 shuttles. The RTL has no
# technology cells, so nothing changes but the PDK, the die and the clock.
name = "gf180-macro"
kind = "macro"
summary = "Hard macro on GlobalFoundries gf180mcuD (5 V cells)"
pdk = "gf180mcuD"

[design]
top = "tiqora_macro"
files = ["src/targets/tiqora_macro.sv"]
clock_port = "clk"
# 60 ns (an estimate): pre-layout, the slowest corner needs 34.0 ns
# register to register (targets/STATUS.md). On sky130 the routed slow-corner
# path came out about 1.6x its pre-layout figure, which puts gf180 near
# 54 ns; 60 ns leaves margin. The gds run decides.
clock_period_ns = 60.0
io_delay_pct = 20

[floorplan]
die_um = [650, 650]
density_pct = 50
max_util_pct = 45

[signoff]
setup_min_ns = 0.0
hold_min_ns = 0.0
max_util_pct = 70

[librelane]
GRT_ADJUSTMENT = 0.15
CTS_SINK_CLUSTERING_SIZE = 10
RUN_POST_GRT_DESIGN_REPAIR = 1
RUN_POST_GRT_RESIZER_TIMING = 1
PL_RESIZER_SETUP_SLACK_MARGIN = 1.0
GRT_RESIZER_SETUP_SLACK_MARGIN = 0.5
PL_RESIZER_HOLD_SLACK_MARGIN = 0.1
GRT_RESIZER_HOLD_SLACK_MARGIN = 0.05
