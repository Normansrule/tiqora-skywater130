<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1500 986' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif'><title>What every pin connects to</title><style>@keyframes fo{to{stroke-dashoffset:-28}}@keyframes fi{to{stroke-dashoffset:28}}.fo{animation:fo 1.2s linear infinite}.fi{animation:fi 1.2s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width='1500' height='986' rx='16' fill='#0b0e14'/><text x='40' y='46' fill='#e9ecef' font-size='26' font-weight='800'>What every pin connects to</text><text x='40' y='74' fill='#8b949e' font-size='15'>The whole microcontroller system: a QSPI memory Pmod, the demo board's RP2350 as clock, reset and USB-serial bridge, plus sensors in and triggers out.</text><rect x='70' y='110' width='240' height='792' rx='14' fill='#1b1b1b' stroke='#555' stroke-width='2'/><text x='94' y='144' fill='#e9ecef' font-size='20' font-weight='800'>Tiqora</text><text x='94' y='166' fill='#8b949e' font-size='13'>3x2 Tiny Tapeout tiles</text><text x='298' y='137' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>clk</text><line x1='310' y1='132' x2='328' y2='132' stroke='#c77dff' stroke-width='3'/><path class='fi' d='M328,132 L1010,132' stroke='#c77dff' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='128' fill='#8b949e' font-size='11.5'>system clock</text><text x='298' y='163' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>rst_n</text><line x1='310' y1='158' x2='328' y2='158' stroke='#c77dff' stroke-width='3'/><path class='fi' d='M328,158 L1010,158' stroke='#c77dff' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='154' fill='#8b949e' font-size='11.5'>reset</text><text x='298' y='189' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>ui[0]</text><line x1='310' y1='184' x2='328' y2='184' stroke='#4f8cff' stroke-width='3'/><path class='fi' d='M328,184 L1010,184' stroke='#4f8cff' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='180' fill='#8b949e' font-size='11.5'>read latency bit 0 (during reset)</text><text x='298' y='215' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>ui[1]</text><line x1='310' y1='210' x2='328' y2='210' stroke='#4f8cff' stroke-width='3'/><path class='fi' d='M328,210 L1010,210' stroke='#4f8cff' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='206' fill='#8b949e' font-size='11.5'>read latency bit 1 (during reset)</text><text x='298' y='241' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>ui[2]</text><line x1='310' y1='236' x2='328' y2='236' stroke='#4f8cff' stroke-width='3'/><path class='fi' d='M328,236 L1010,236' stroke='#4f8cff' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='232' fill='#8b949e' font-size='11.5'>read latency bit 2 (during reset)</text><text x='298' y='267' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>ui[7]</text><line x1='310' y1='262' x2='328' y2='262' stroke='#4f8cff' stroke-width='3'/><path class='fi' d='M328,262 L1010,262' stroke='#4f8cff' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='258' fill='#8b949e' font-size='11.5'>BOOT strap: high in reset = bootloader</text><text x='298' y='293' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>ui[3]</text><line x1='310' y1='288' x2='328' y2='288' stroke='#4f8cff' stroke-width='3'/><path class='fi' d='M328,288 L1010,288' stroke='#4f8cff' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='284' fill='#8b949e' font-size='11.5'>UART RX, from the RP2350</text><text x='298' y='319' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uo[4]</text><line x1='310' y1='314' x2='328' y2='314' stroke='#3ddc97' stroke-width='3'/><path class='fo' d='M328,314 L1010,314' stroke='#3ddc97' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='310' fill='#8b949e' font-size='11.5'>UART TX, to the RP2350</text><rect x='1010' y='116' width='450' height='214' rx='10' fill='#161b22' stroke='#c77dff' stroke-width='2'/><text x='1030' y='142' fill='#e9ecef' font-size='16' font-weight='800'>Demo board RP2350</text><text x='1030' y='162' fill='#8b949e' font-size='12.5'>clock, reset, straps, and the USB-C serial bridge</text><text x='298' y='369' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uio[0]</text><line x1='310' y1='364' x2='328' y2='364' stroke='#ff9f1c' stroke-width='3'/><path class='fo' d='M328,364 L1010,364' stroke='#ff9f1c' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='360' fill='#8b949e' font-size='11.5'>CS0: flash W25Q128 (16 MB)</text><text x='298' y='395' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uio[1]</text><line x1='310' y1='390' x2='328' y2='390' stroke='#ff9f1c' stroke-width='3'/><path class='fo' d='M328,390 L1010,390' stroke='#ff9f1c' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='386' fill='#8b949e' font-size='11.5'>SD0 data (bidirectional)</text><text x='298' y='421' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uio[2]</text><line x1='310' y1='416' x2='328' y2='416' stroke='#ff9f1c' stroke-width='3'/><path class='fi' d='M328,416 L1010,416' stroke='#ff9f1c' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='412' fill='#8b949e' font-size='11.5'>SD1 data (bidirectional)</text><text x='298' y='447' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uio[3]</text><line x1='310' y1='442' x2='328' y2='442' stroke='#ff9f1c' stroke-width='3'/><path class='fo' d='M328,442 L1010,442' stroke='#ff9f1c' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='438' fill='#8b949e' font-size='11.5'>SCK memory clock</text><text x='298' y='473' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uio[4]</text><line x1='310' y1='468' x2='328' y2='468' stroke='#ff9f1c' stroke-width='3'/><path class='fo' d='M328,468 L1010,468' stroke='#ff9f1c' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='464' fill='#8b949e' font-size='11.5'>SD2 data (bidirectional)</text><text x='298' y='499' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uio[5]</text><line x1='310' y1='494' x2='328' y2='494' stroke='#ff9f1c' stroke-width='3'/><path class='fi' d='M328,494 L1010,494' stroke='#ff9f1c' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='490' fill='#8b949e' font-size='11.5'>SD3 data (bidirectional)</text><text x='298' y='525' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uio[6]</text><line x1='310' y1='520' x2='328' y2='520' stroke='#ff9f1c' stroke-width='3'/><path class='fo' d='M328,520 L1010,520' stroke='#ff9f1c' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='516' fill='#8b949e' font-size='11.5'>CS1: RAM A APS6404L (8 MB)</text><text x='298' y='551' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uio[7]</text><line x1='310' y1='546' x2='328' y2='546' stroke='#ff9f1c' stroke-width='3'/><path class='fo' d='M328,546 L1010,546' stroke='#ff9f1c' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='542' fill='#8b949e' font-size='11.5'>CS2: RAM B APS6404L (8 MB)</text><rect x='1010' y='348' width='450' height='214' rx='10' fill='#161b22' stroke='#ff9f1c' stroke-width='2'/><text x='1030' y='374' fill='#e9ecef' font-size='16' font-weight='800'>QSPI Pmod</text><text x='1030' y='394' fill='#8b949e' font-size='12.5'>16 MB flash + two 8 MB RAMs; all code and data live here</text><text x='298' y='601' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>ui[4]</text><line x1='310' y1='596' x2='328' y2='596' stroke='#4f8cff' stroke-width='3'/><path class='fi' d='M328,596 L1010,596' stroke='#4f8cff' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='592' fill='#8b949e' font-size='11.5'>capture 4</text><text x='298' y='627' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>ui[5]</text><line x1='310' y1='622' x2='328' y2='622' stroke='#4f8cff' stroke-width='3'/><path class='fi' d='M328,622 L1010,622' stroke='#4f8cff' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='618' fill='#8b949e' font-size='11.5'>capture 5</text><text x='298' y='653' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>ui[6]</text><line x1='310' y1='648' x2='328' y2='648' stroke='#4f8cff' stroke-width='3'/><path class='fi' d='M328,648 L1010,648' stroke='#4f8cff' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='644' fill='#8b949e' font-size='11.5'>capture 6</text><rect x='1010' y='580' width='450' height='84' rx='10' fill='#161b22' stroke='#4f8cff' stroke-width='2'/><text x='1030' y='606' fill='#e9ecef' font-size='16' font-weight='800'>Sensors</text><text x='1030' y='626' fill='#8b949e' font-size='12.5'>every edge timestamped to the clock (all 8 inputs can capture)</text><text x='298' y='703' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uo[0]</text><line x1='310' y1='698' x2='328' y2='698' stroke='#3ddc97' stroke-width='3'/><path class='fo' d='M328,698 L1010,698' stroke='#3ddc97' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='694' fill='#8b949e' font-size='11.5'>TRIG0 deadline trigger</text><text x='298' y='729' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uo[1]</text><line x1='310' y1='724' x2='328' y2='724' stroke='#3ddc97' stroke-width='3'/><path class='fo' d='M328,724 L1010,724' stroke='#3ddc97' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='720' fill='#8b949e' font-size='11.5'>TRIG1 deadline trigger</text><rect x='1010' y='682' width='450' height='58' rx='10' fill='#161b22' stroke='#3ddc97' stroke-width='2'/><text x='1030' y='708' fill='#e9ecef' font-size='16' font-weight='800'>Cameras / actuators</text><text x='1030' y='728' fill='#8b949e' font-size='12.5'>pulses at an exact clock tick, set by TARM</text><text x='298' y='779' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uo[2]</text><line x1='310' y1='774' x2='328' y2='774' stroke='#3ddc97' stroke-width='3'/><path class='fo' d='M328,774 L1010,774' stroke='#3ddc97' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='770' fill='#8b949e' font-size='11.5'>EVT event waiting</text><text x='298' y='805' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uo[3]</text><line x1='310' y1='800' x2='328' y2='800' stroke='#3ddc97' stroke-width='3'/><path class='fo' d='M328,800 L1010,800' stroke='#3ddc97' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='796' fill='#8b949e' font-size='11.5'>OVF queue overflow</text><text x='298' y='831' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uo[5]</text><line x1='310' y1='826' x2='328' y2='826' stroke='#3ddc97' stroke-width='3'/><path class='fo' d='M328,826 L1010,826' stroke='#3ddc97' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='822' fill='#8b949e' font-size='11.5'>HALT</text><text x='298' y='857' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uo[6]</text><line x1='310' y1='852' x2='328' y2='852' stroke='#3ddc97' stroke-width='3'/><path class='fo' d='M328,852 L1010,852' stroke='#3ddc97' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='848' fill='#8b949e' font-size='11.5'>ILLEGAL instruction</text><text x='298' y='883' text-anchor='end' fill='#e9ecef' font-size='13' font-family='JetBrains Mono,SFMono-Regular,Consolas,monospace'>uo[7]</text><line x1='310' y1='878' x2='328' y2='878' stroke='#3ddc97' stroke-width='3'/><path class='fo' d='M328,878 L1010,878' stroke='#3ddc97' stroke-width='2' stroke-dasharray='5 9' fill='none'/><text x='340' y='874' fill='#8b949e' font-size='11.5'>HEARTBEAT (blinks)</text><rect x='1010' y='758' width='450' height='136' rx='10' fill='#161b22' stroke='#ffd23f' stroke-width='2'/><text x='1030' y='784' fill='#e9ecef' font-size='16' font-weight='800'>Status LEDs</text><text x='1030' y='804' fill='#8b949e' font-size='12.5'>or the demo board's 7-segment display; all can become GPIO</text><text x='40' y='960' fill='#8b949e' font-size='13'>Signal flow: the dashes move toward the chip on inputs and away from it on outputs. Colours: purple clock/reset, blue inputs, green outputs, orange bidirectional.</text></svg>