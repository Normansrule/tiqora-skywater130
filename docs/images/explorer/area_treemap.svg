<svg xmlns='http://www.w3.org/2000/svg' viewBox='-2 -2 764 556.3554706163402' role='img' aria-labelledby='tm-t tm-d'><title id='tm-t'>Tiqora: measured cell area per block, to scale against the 2x2 tile</title><desc id='tm-d'>The outer rectangle is the Tiny Tapeout 2x2 die, 334.88 by 225.76 µm. The inner rectangles add up to the 62,401 µm² of standard cells Yosys synthesis measured, module by module, 83% of the die. Sizes are to scale; positions are not a floorplan.</desc><style>:root { --bg: #f5f5f2; /* paper */ --surface: #fdfdfb; --surface-2: #ebebe6; --ink: #121416; --ink-2: #383d42; --muted: #575d63; --line: #d8d9d3; --line-2: #bcbfb8; --trace: #8f5200; /* the signature: a recorded trace, in amber */ --accent: #0b5f86; /* the probe: links, focus, the cursor, the current selection */ --accent-ink: #ffffff; --button: #121416; /* the primary button is ink, not accent */ --button-ink: #f5f5f2; --focus: #0b5f86; /* signal kinds in the waveform */ --sig-bit: #9a5800; --sig-bus: #0b6e57; --sig-enum: #a3406f; --sig-text: #383d42; --sig-pin: #2e7032; --sig-unknown: #a3a7a2; --cursor: #0b5f86; /* block categories (dataviz palette, validated for colour-vision deficiency) */ --cat-interface: #2a78d6; --cat-compute: #eb6834; --cat-memory: #1baf7a; --cat-timing: #eda100; --cat-control: #e87ba4; --cat-pins: #008300; /* evidence */ --ok: #17703a; --est: #855700; --fail: #b42318; --todo: #575d63; --rec: #0b5f86; /* the screen: code blocks and the die zoom are always the instrument's screen */ --screen: #0b0d0c; --screen-ink: #e5e8e3; --screen-dim: #8e968f; --screen-line: #2a302d; --code-bg: #121416; --code-ink: #e5e8e3; --code-dim: #9aa29b; --radius: 4px; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; --sans: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --display: "Barlow Semi Condensed", "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif; color-scheme: light; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0d0c; --surface: #111413; --surface-2: #181c1a; --ink: #e5e8e3; --ink-2: #bcc3bd; --muted: #8e968f; --line: #242927; --line-2: #363d3a; --trace: #ffb000; --accent: #7cc6ea; --accent-ink: #0b0d0c; --button: #e5e8e3; --button-ink: #0b0d0c; --focus: #7cc6ea; --sig-bit: #ffb000; --sig-bus: #5fd0a6; --sig-enum: #e391bd; --sig-text: #bcc3bd; --sig-pin: #8bd17c; --sig-unknown: #4d5651; --cursor: #9ad8f7; --cat-interface: #3987e5; --cat-compute: #d95926; --cat-memory: #199e70; --cat-timing: #c98500; --cat-control: #d55181; --cat-pins: #008300; --ok: #5bd28a; --est: #e8b84a; --fail: #ff7b72; --todo: #8e968f; --rec: #7cc6ea; --code-bg: #070908; --code-ink: #e5e8e3; --code-dim: #8a928b; color-scheme: dark; } } :root[data-theme="dark"] { --bg: #0b0d0c; --surface: #111413; --surface-2: #181c1a; --ink: #e5e8e3; --ink-2: #bcc3bd; --muted: #8e968f; --line: #242927; --line-2: #363d3a; --trace: #ffb000; --accent: #7cc6ea; --accent-ink: #0b0d0c; --button: #e5e8e3; --button-ink: #0b0d0c; --focus: #7cc6ea; --sig-bit: #ffb000; --sig-bus: #5fd0a6; --sig-enum: #e391bd; --sig-text: #bcc3bd; --sig-pin: #8bd17c; --sig-unknown: #4d5651; --cursor: #9ad8f7; --cat-interface: #3987e5; --cat-compute: #d95926; --cat-memory: #199e70; --cat-timing: #c98500; --cat-control: #d55181; --cat-pins: #008300; --ok: #5bd28a; --est: #e8b84a; --fail: #ff7b72; --todo: #8e968f; --rec: #7cc6ea; --code-bg: #070908; --code-ink: #e5e8e3; --code-dim: #8a928b; color-scheme: dark; } .cat-pins { --c: var(--cat-pins); } .cat-interface { --c: var(--cat-interface); } .cat-control { --c: var(--cat-control); } .cat-compute { --c: var(--cat-compute); } .cat-memory { --c: var(--cat-memory); } .cat-timing { --c: var(--cat-timing); } .tm-die { fill: var(--surface-2); stroke: var(--muted); stroke-dasharray: 6 4; stroke-width: 1.5; } .tm-cell { fill: color-mix(in srgb, var(--c) 30%, var(--surface)); stroke: var(--c); stroke-width: 1.5; } .tm-name { font: 700 12px var(--mono); fill: var(--ink); pointer-events: none; } .tm-val, .tm-short { font: 11.5px var(--mono); fill: var(--ink); pointer-events: none; } .tm-note { font: 12px var(--sans); fill: var(--muted); } .fl-chip { fill: var(--surface-2); stroke: var(--line-2); stroke-width: 1.5; } .fl-chiplbl { font: 12px var(--mono); fill: var(--muted); } .fl-col { font: 700 13px var(--sans); fill: var(--ink-2); } .fl-edge { fill: none; stroke: var(--muted); stroke-width: 1.6; } .fl-arrow { fill: var(--muted); } .fl-elbl { font: 12px var(--sans); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4; } .fl-elbl.in { stroke: var(--surface-2); } .fl-node { fill: var(--surface); stroke: var(--c, var(--line-2)); stroke-width: 1.8; } .fl-ext { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; stroke-dasharray: 4 3; } .fl-title { font: 700 13.5px var(--sans); fill: var(--ink); } .fl-sub { font: 12px var(--sans); fill: var(--ink-2); }</style><rect x='-2' y='-2' width='764' height='556.3554706163402' fill='var(--surface)'/><rect class='tm-die' x='0' y='0' width='760' height='512.3554706163402'/><g><title>Nibble-serial RV32E core (tp_ncore): 12,792 µm²</title><rect class='tm-cell cat-compute' x='35.8' y='24.4' width='274.4' height='236.3'/><text class='tm-name' x='41.8' y='41.4'>tp_ncore</text><text class='tm-val' x='41.8' y='56.4'>12,792 µm²</text></g><g><title>Rotating register file (tp_nregfile): 12,192 µm²</title><rect class='tm-cell cat-memory' x='35.8' y='262.8' width='274.4' height='225.1'/><text class='tm-name' x='41.8' y='279.8'>tp_nregfile</text><text class='tm-val' x='41.8' y='294.8'>12,192 µm²</text></g><g><title>QSPI memory controller (qspi_ctrl): 8,023 µm²</title><rect class='tm-cell cat-interface' x='312.2' y='24.4' width='220.9' height='183.4'/><text class='tm-name' x='318.2' y='41.4'>qspi_ctrl</text><text class='tm-val' x='318.2' y='56.4'>8,023 µm²</text></g><g><title>Deadline comparators (sync_compare): 6,882 µm²</title><rect class='tm-cell cat-timing' x='535.1' y='24.4' width='189.2' height='183.4'/><text class='tm-name' x='541.1' y='41.4'>sync_compare</text><text class='tm-val' x='541.1' y='56.4'>6,882 µm²</text></g><g><title>Timebase with rate trim (sync_timebase): 5,530 µm²</title><rect class='tm-cell cat-timing' x='312.2' y='209.9' width='194.3' height='143.1'/><text class='tm-name' x='318.2' y='226.9'>sync_timebase</text><text class='tm-val' x='318.2' y='241.9'>5,530 µm²</text></g><g><title>Timing unit (sync_unit): 5,144 µm²</title><rect class='tm-cell cat-timing' x='312.2' y='355.0' width='194.3' height='133.0'/><text class='tm-name' x='318.2' y='372.0'>sync_unit</text><text class='tm-val' x='318.2' y='387.0'>5,144 µm²</text></g><g><title>UART (8N1) (tp_uart): 3,222 µm²</title><rect class='tm-cell cat-interface' x='508.5' y='209.9' width='114.6' height='140.3'/><text class='tm-name' x='514.5' y='226.9'>tp_uart</text><text class='tm-val' x='514.5' y='241.9'>3,222 µm²</text></g><g><title>Event queue (sync_event_fifo): 2,795 µm²</title><rect class='tm-cell cat-memory' x='625.1' y='209.9' width='99.1' height='140.3'/><text class='tm-name' x='631.1' y='226.9'>sync_event_fifo</text><text class='tm-val' x='631.1' y='241.9'>2,795 µm²</text></g><g><title>GPIO and UART registers (tp_periph): 1,858 µm²</title><rect class='tm-cell cat-interface' x='508.5' y='352.2' width='67.5' height='135.7'/><text class='tm-short' x='512.5' y='365.2'>tp_periph</text></g><g><title>Bus: address decode and arbitration (tp_bus): 1,509 µm²</title><rect class='tm-cell cat-control' x='578.0' y='352.2' width='101.1' height='73.4'/><text class='tm-name' x='584.0' y='369.2'>tp_bus</text><text class='tm-val' x='584.0' y='384.2'>1,509 µm²</text></g><g><title>Boot ROM (UART bootloader) (tp_bootrom): 1,249 µm²</title><rect class='tm-cell cat-memory' x='578.0' y='427.6' width='101.1' height='60.4'/><text class='tm-name' x='584.0' y='444.6'>tp_bootrom</text><text class='tm-val' x='584.0' y='459.6'>1,249 µm²</text></g><g><title>Capture lanes (sync_capture): 931 µm²</title><rect class='tm-cell cat-timing' x='681.1' y='352.2' width='43.1' height='104.3'/><text class='tm-short' x='685.1' y='365.2'>sync_c</text></g><g><title>Microcontroller top level (tp_soc): 246 µm²</title><rect class='tm-cell cat-control' x='681.1' y='458.5' width='38.4' height='29.4'/><text class='tm-short' x='685.1' y='471.5'>tp_so</text></g><g><title>Tiny Tapeout pin wrapper (tt_um_normansrule_tiqora): 28.8 µm²</title><rect class='tm-cell cat-pins' x='721.5' y='458.5' width='2.7' height='29.4'/></g><text class='tm-note' x='0' y='531.3554706163402'>dashed: the 2x2 die, 334.88 × 225.76 µm = 75,603 µm² (Tiny Tapeout template)</text><text class='tm-note' x='0' y='548.3554706163402'>filled: 62,401 µm² of cells, summed per module (83% of the die) · sizes to scale, positions are not a floorplan</text></svg>
