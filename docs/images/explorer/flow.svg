<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 440' role='img' aria-labelledby='flow-t flow-d'><title id='flow-t'>Tiqora: what enters, what happens inside, what comes out</title><desc id='flow-d'>Program and data come from the QSPI Pmod&#x27;s flash and RAM through the QSPI controller and the bus to the nibble-serial RV32E core. Pin edges enter the timing unit, which the core drives with Xpulse instructions. Triggers, flags and UART TX leave on uo_out.</desc><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path class='fl-arrow' d='M0 0 L10 5 L0 10 z'/></marker></defs><style>:root { --bg: #f5f5f2; /* paper */ --surface: #fdfdfb; --surface-2: #ebebe6; --ink: #121416; --ink-2: #383d42; --muted: #575d63; --line: #d8d9d3; --line-2: #bcbfb8; --trace: #8f5200; /* the signature: a recorded trace, in amber */ --accent: #0b5f86; /* the probe: links, focus, the cursor, the current selection */ --accent-ink: #ffffff; --button: #121416; /* the primary button is ink, not accent */ --button-ink: #f5f5f2; --focus: #0b5f86; /* signal kinds in the waveform */ --sig-bit: #9a5800; --sig-bus: #0b6e57; --sig-enum: #a3406f; --sig-text: #383d42; --sig-pin: #2e7032; --sig-unknown: #a3a7a2; --cursor: #0b5f86; /* block categories (dataviz palette, validated for colour-vision deficiency) */ --cat-interface: #2a78d6; --cat-compute: #eb6834; --cat-memory: #1baf7a; --cat-timing: #eda100; --cat-control: #e87ba4; --cat-pins: #008300; /* evidence */ --ok: #17703a; --est: #855700; --fail: #b42318; --todo: #575d63; --rec: #0b5f86; /* the screen: code blocks and the die zoom are always the instrument's screen */ --screen: #0b0d0c; --screen-ink: #e5e8e3; --screen-dim: #8e968f; --screen-line: #2a302d; --code-bg: #121416; --code-ink: #e5e8e3; --code-dim: #9aa29b; --radius: 4px; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; --sans: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --display: "Barlow Semi Condensed", "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif; color-scheme: light; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0d0c; --surface: #111413; --surface-2: #181c1a; --ink: #e5e8e3; --ink-2: #bcc3bd; --muted: #8e968f; --line: #242927; --line-2: #363d3a; --trace: #ffb000; --accent: #7cc6ea; --accent-ink: #0b0d0c; --button: #e5e8e3; --button-ink: #0b0d0c; --focus: #7cc6ea; --sig-bit: #ffb000; --sig-bus: #5fd0a6; --sig-enum: #e391bd; --sig-text: #bcc3bd; --sig-pin: #8bd17c; --sig-unknown: #4d5651; --cursor: #9ad8f7; --cat-interface: #3987e5; --cat-compute: #d95926; --cat-memory: #199e70; --cat-timing: #c98500; --cat-control: #d55181; --cat-pins: #008300; --ok: #5bd28a; --est: #e8b84a; --fail: #ff7b72; --todo: #8e968f; --rec: #7cc6ea; --code-bg: #070908; --code-ink: #e5e8e3; --code-dim: #8a928b; color-scheme: dark; } } :root[data-theme="dark"] { --bg: #0b0d0c; --surface: #111413; --surface-2: #181c1a; --ink: #e5e8e3; --ink-2: #bcc3bd; --muted: #8e968f; --line: #242927; --line-2: #363d3a; --trace: #ffb000; --accent: #7cc6ea; --accent-ink: #0b0d0c; --button: #e5e8e3; --button-ink: #0b0d0c; --focus: #7cc6ea; --sig-bit: #ffb000; --sig-bus: #5fd0a6; --sig-enum: #e391bd; --sig-text: #bcc3bd; --sig-pin: #8bd17c; --sig-unknown: #4d5651; --cursor: #9ad8f7; --cat-interface: #3987e5; --cat-compute: #d95926; --cat-memory: #199e70; --cat-timing: #c98500; --cat-control: #d55181; --cat-pins: #008300; --ok: #5bd28a; --est: #e8b84a; --fail: #ff7b72; --todo: #8e968f; --rec: #7cc6ea; --code-bg: #070908; --code-ink: #e5e8e3; --code-dim: #8a928b; color-scheme: dark; } .cat-pins { --c: var(--cat-pins); } .cat-interface { --c: var(--cat-interface); } .cat-control { --c: var(--cat-control); } .cat-compute { --c: var(--cat-compute); } .cat-memory { --c: var(--cat-memory); } .cat-timing { --c: var(--cat-timing); } .tm-die { fill: var(--surface-2); stroke: var(--muted); stroke-dasharray: 6 4; stroke-width: 1.5; } .tm-cell { fill: color-mix(in srgb, var(--c) 30%, var(--surface)); stroke: var(--c); stroke-width: 1.5; } .tm-name { font: 700 12px var(--mono); fill: var(--ink); pointer-events: none; } .tm-val, .tm-short { font: 11.5px var(--mono); fill: var(--ink); pointer-events: none; } .tm-note { font: 12px var(--sans); fill: var(--muted); } .fl-chip { fill: var(--surface-2); stroke: var(--line-2); stroke-width: 1.5; } .fl-chiplbl { font: 12px var(--mono); fill: var(--muted); } .fl-col { font: 700 13px var(--sans); fill: var(--ink-2); } .fl-edge { fill: none; stroke: var(--muted); stroke-width: 1.6; } .fl-arrow { fill: var(--muted); } .fl-elbl { font: 12px var(--sans); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4; } .fl-elbl.in { stroke: var(--surface-2); } .fl-node { fill: var(--surface); stroke: var(--c, var(--line-2)); stroke-width: 1.8; } .fl-ext { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; stroke-dasharray: 4 3; } .fl-title { font: 700 13.5px var(--sans); fill: var(--ink); } .fl-sub { font: 12px var(--sans); fill: var(--ink-2); } svg { font-family: var(--sans); }</style><rect width='1000' height='440' rx='6' fill='var(--surface)' stroke='var(--line)'/><g class='fl-g' style='--d:1'><rect class='fl-chip' x='235' y='40' width='520' height='380' rx='6'/><text class='fl-chiplbl' x='247' y='408'>tt_um_normansrule_tiqora · tp_soc · one 50 MHz clock</text></g><text class='fl-g fl-col' style='--d:0' x='20' y='26'>What enters</text><text class='fl-g fl-col' style='--d:1' x='255' y='26'>Inside the chip</text><text class='fl-g fl-col' style='--d:3' x='790' y='26'>What comes out</text><path class='fl-g fl-edge' style='--d:0.5' d='M210 98.0 C231.5 98.0 231.5 91.0 253 91.0' marker-end='url(#ar)'/><path class='fl-g fl-edge' style='--d:1.5' d='M360.0 122 L360.0 148' marker-end='url(#ar)'/><path class='fl-g fl-edge' style='--d:1.5' d='M360.0 245 L360.0 200' marker-end='url(#ar)'/><path class='fl-g fl-edge' style='--d:1.5' d='M465 174.0 C486.5 174.0 486.5 91.0 508 91.0' marker-end='url(#ar)'/><path class='fl-g fl-edge' style='--d:2.5' d='M622.5 122 L622.5 188' marker-end='url(#ar)'/><path class='fl-g fl-edge' style='--d:0.5' d='M210 228.0 C359.0 228.0 359.0 221.0 508 221.0' marker-end='url(#ar)'/><path class='fl-g fl-edge' style='--d:2.5' d='M735 221.0 C761.5 221.0 761.5 228.0 788 228.0' marker-end='url(#ar)'/><path class='fl-g fl-edge' style='--d:1.5' d='M465 174.0 C486.5 174.0 486.5 354.0 508 354.0' marker-end='url(#ar)'/><path class='fl-g fl-edge' style='--d:2.5' d='M735 354.0 C761.5 354.0 761.5 228.0 788 228.0' marker-end='url(#ar)'/><g class='fl-g' style='--d:0'><rect class='fl-ext' x='20' y='60' width='190' height='76' rx='5'/><text class='fl-title' x='30' y='79'>QSPI Pmod (uio)</text><text class='fl-sub' x='30' y='95'>16 MB flash: the program</text><text class='fl-sub' x='30' y='109'>2 × 8 MB RAM: data</text><text class='fl-sub' x='30' y='123'>SD0–SD3, SCK, three selects</text></g><g class='fl-g' style='--d:0'><rect class='fl-ext' x='20' y='190' width='190' height='76' rx='5'/><text class='fl-title' x='30' y='209'>ui_in[7:0]</text><text class='fl-sub' x='30' y='225'>IN0–IN7: edges to timestamp</text><text class='fl-sub' x='30' y='239'>ui_in[3]: UART RX</text><text class='fl-sub' x='30' y='253'>ui_in[7] at reset: bootloader</text></g><g class='fl-g' style='--d:0'><rect class='fl-ext' x='20' y='330' width='190' height='62' rx='5'/><text class='fl-title' x='30' y='349'>clk, rst_n</text><text class='fl-sub' x='30' y='365'>50 MHz, one clock domain</text><text class='fl-sub' x='30' y='379'>synchronous reset</text></g><g class='fl-g' style='--d:1'><rect class='fl-node cat-interface' x='255' y='60' width='210' height='62' rx='5'/><text class='fl-title' x='265' y='79'>QSPI controller</text><text class='fl-sub' x='265' y='95'>wakes both memories,</text><text class='fl-sub' x='265' y='109'>streams 4-bit reads</text></g><g class='fl-g' style='--d:1'><rect class='fl-node cat-control' x='255' y='150' width='210' height='48' rx='5'/><text class='fl-title' x='265' y='169'>Bus</text><text class='fl-sub' x='265' y='185'>decodes addr[31:28]</text></g><g class='fl-g' style='--d:1'><rect class='fl-node cat-memory' x='255' y='245' width='210' height='48' rx='5'/><text class='fl-title' x='265' y='264'>Boot ROM</text><text class='fl-sub' x='265' y='280'>UART loader table</text></g><g class='fl-g' style='--d:2'><rect class='fl-node cat-compute' x='510' y='60' width='225' height='62' rx='5'/><text class='fl-title' x='520' y='79'>Nibble-serial RV32E core</text><text class='fl-sub' x='520' y='95'>one 4-bit adder, 8 phases</text><text class='fl-sub' x='520' y='109'>registers rotate past it</text></g><g class='fl-g' style='--d:2'><rect class='fl-node cat-timing' x='510' y='190' width='225' height='62' rx='5'/><text class='fl-title' x='520' y='209'>Timing unit (Xpulse)</text><text class='fl-sub' x='520' y='225'>timebase · capture ·</text><text class='fl-sub' x='520' y='239'>event queue · deadlines</text></g><g class='fl-g' style='--d:2'><rect class='fl-node cat-interface' x='510' y='330' width='225' height='48' rx='5'/><text class='fl-title' x='520' y='349'>UART and GPIO</text><text class='fl-sub' x='520' y='365'>printf, pin select</text></g><g class='fl-g' style='--d:3'><rect class='fl-ext' x='790' y='190' width='190' height='76' rx='5'/><text class='fl-title' x='800' y='209'>uo_out[7:0]</text><text class='fl-sub' x='800' y='225'>TRIG0, TRIG1 on the exact tick</text><text class='fl-sub' x='800' y='239'>EVT, OVF, HALT, ILLEGAL</text><text class='fl-sub' x='800' y='253'>uo_out[4]: UART TX</text></g><text class='fl-g fl-elbl in' style='--d:2.5' x='629.5' y='159.0'>Xpulse</text><text class='fl-g fl-elbl in' style='--d:0.5' x='418.6' y='217.1' text-anchor='middle'>edges</text></svg>
