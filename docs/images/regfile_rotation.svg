<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 470' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif'><title>The rotating register file</title><style>@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-464px)}}.row{animation:slide 8s steps(8) infinite}@keyframes q0{0%,0.00%{opacity:0}0.01%,12.50%{opacity:1}12.51%,100%{opacity:0}}.p0{animation:q0 8s infinite;opacity:0}@keyframes q1{0%,12.50%{opacity:0}12.51%,25.00%{opacity:1}25.01%,100%{opacity:0}}.p1{animation:q1 8s infinite;opacity:0}@keyframes q2{0%,25.00%{opacity:0}25.01%,37.50%{opacity:1}37.51%,100%{opacity:0}}.p2{animation:q2 8s infinite;opacity:0}@keyframes q3{0%,37.50%{opacity:0}37.51%,50.00%{opacity:1}50.01%,100%{opacity:0}}.p3{animation:q3 8s infinite;opacity:0}@keyframes q4{0%,50.00%{opacity:0}50.01%,62.50%{opacity:1}62.51%,100%{opacity:0}}.p4{animation:q4 8s infinite;opacity:0}@keyframes q5{0%,62.50%{opacity:0}62.51%,75.00%{opacity:1}75.01%,100%{opacity:0}}.p5{animation:q5 8s infinite;opacity:0}@keyframes q6{0%,75.00%{opacity:0}75.01%,87.50%{opacity:1}87.51%,100%{opacity:0}}.p6{animation:q6 8s infinite;opacity:0}@keyframes q7{0%,87.50%{opacity:0}87.51%,100.00%{opacity:1}100.01%,100%{opacity:0}}.p7{animation:q7 8s infinite;opacity:0}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width='1000' height='470' rx='16' fill='#0b0e14'/><text x='40' y='50' fill='#e9ecef' font-size='24' font-weight='800'>Why the register file is half the size</text><text x='40' y='78' fill='#8b949e' font-size='15'>Every register rotates by one nibble every clock, all 15 in lockstep. The read port only ever looks at one 4-bit slot.</text><rect x='246' y='120' width='60' height='246' rx='9' fill='none' stroke='#3ddc97' stroke-width='3'/><text x='276.0' y='110' text-anchor='middle' fill='#3ddc97' font-size='14' font-weight='700'>read port</text><text x='226' y='157' text-anchor='end' fill='#8b949e' font-size='18' font-family='JetBrains Mono,SFMono-Regular,Consolas,mo