<svg xmlns='http://www.w3.org/2000/svg' width='460' height='270' viewBox='0 0 460 270' role='img' aria-label='Nibble-serial RV32E: One 4-bit adder does every 32-bit add in eight clocks. Register file: 11,322 µm², against 21,837 µm².'><title>Nibble-serial RV32E: One 4-bit adder does every 32-bit add in eight clocks. Register file: 11,322 µm², against 21,837 µm².</title><style>svg{--bg:#ffffff;--edge:#d0d7de;--ink:#1f2328;--ink2:#59636e;--dim:#d8dee4;--box:#f6f8fa;--hi:#bf6a00;--ok:#1a7f37;--acc:#0969da}@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--edge:#3d444d;--ink:#e6edf3;--ink2:#9198a1;--dim:#30363d;--box:#151b23;--hi:#ffb000;--ok:#3fb950;--acc:#4493f8}}.bg{fill:var(--bg);stroke:var(--edge)}.t{font:700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--ink);letter-spacing:-.3px}.e{font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--hi);letter-spacing:1.4px}.l{font:400 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--ink2)}.m{font:500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:var(--ink2)}.mb{font:700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:var(--ink)}.box{fill:var(--box);stroke:var(--edge)}.dim{stroke:var(--dim);fill:none}.hi{stroke:var(--hi);fill:none}.hif{fill:var(--hi)}.okf{fill:var(--ok)}.dimf{fill:var(--dim)}.acc{stroke:var(--acc);fill:none}.pill{fill:none;stroke:var(--hi)}@media (prefers-reduced-motion:no-preference){.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.23,1,.32,1) .25s forwards}@keyframes draw{to{stroke-dashoffset:0}}.rise{opacity:0;animation:rise .55s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d,0)*90ms + 200ms)}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .9s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d,0)*110ms + 250ms)}@keyframes grow{to{transform:none}}}</style><rect class="bg" x=".5" y=".5" width="459" height="269" rx="16"/><text class="e" x="40" y="42">THE CORE</text><rect class="pill" x="338" y="27" width="82" height="22" rx="11"/><text class="e" x="411" y="42" text-anchor="end" style='letter-spacing:.4px'>measured</text><text class="t" x="40" y="72">Nibble-serial RV32E</text><text class="m" x="40" y="100">x11 after add x11, x9, x10</text><text class="m" x="40" y="174">nibble 7</text><text class="m" x="420" y="174" text-anchor="end">nibble 0</text><g class="rise" style='--d:7'><rect class="box" x="40" y="110" width="40" height="46" rx="8"/><text class="mb" x="60" y="140" text-anchor="middle">2</text></g><g class="rise" style='--d:6'><rect class="box" x="88" y="110" width="40" height="46" rx="8"/><text class="mb" x="108" y="140" text-anchor="middle">2</text></g><g class="rise" style='--d:5'><rect class="box" x="136" y="110" width="40" height="46" rx="8"/><text class="mb" x="156" y="140" text-anchor="middle">2</text></g><g class="rise" style='--d:4'><rect class="box" x="184" y="110" width="40" height="46" rx="8"/><text class="mb" x="204" y="140" text-anchor="middle">2</text></g><g class="rise" style='--d:3'><rect class="box" x="232" y="110" width="40" height="46" rx="8"/><text class="mb" x="252" y="140" text-anchor="middle">2</text></g><g class="rise" style='--d:2'><rect class="box" x="280" y="110" width="40" height="46" rx="8"/><text class="mb" x="300" y="140" text-anchor="middle">2</text></g><g class="rise" style='--d:1'><rect class="box" x="328" y="110" width="40" height="46" rx="8"/><text class="mb" x="348" y="140" text-anchor="middle">2</text></g><g class="rise" style='--d:0'><rect class="box" x="376" y="110" width="40" height="46" rx="8"/><text class="mb" x="396" y="140" text-anchor="middle">1</text></g><path class='hi draw' pathLength="1" stroke-width="2" d='M392,182 C392,196 88,196 88,182'/><text class="l" x="40" y="222">One 4-bit adder does every 32-bit add in eight clocks.</text><text class="l" x="40" y="242">Register file: 11,322 µm², against 21,837 µm².</text></svg>
