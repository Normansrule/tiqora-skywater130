<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 364' width='880' height='364' role='img' aria-labelledby='m-fetch-t m-fetch-d' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title id='m-fetch-t'>Instruction fetch over QSPI</title><desc id='m-fetch-d'>Two instruction fetches at the pins: one with a full address preamble, one streamed. Watch the byte order: least significant byte first, high nibble first. Recorded from an RTL simulation, not computed in the browser. Made by docs/tools/motion.py from docs/site/data/traces/fetch.json.</desc><style>@keyframes m-fetch-sweep{0.00%{transform:translateX(0.0px);animation-timing-function:ease-in-out}2.78%{transform:translateX(37.1px)}13.10%{transform:translateX(37.1px);animation-timing-function:ease-in-out}15.87%{transform:translateX(218.9px)}26.19%{transform:translateX(218.9px);animation-timing-function:ease-in-out}28.97%{transform:translateX(309.9px)}39.29%{transform:translateX(309.9px);animation-timing-function:ease-in-out}42.06%{transform:translateX(491.7px)}52.38%{transform:translateX(491.7px);animation-timing-function:ease-in-out}55.16%{transform:translateX(514.4px)}65.48%{transform:translateX(514.4px);animation-timing-function:ease-in-out}68.25%{transform:translateX(696.3px)}78.57%{transform:translateX(696.3px);animation-timing-function:ease-in-out}84.13%{transform:translateX(716.0px)}99.6%{transform:translateX(716.0px)}100%{transform:translateX(0)}}@media (prefers-reduced-motion:no-preference){.m-fetch-sum{visibility:hidden}.m-fetch-cap,.m-fetch-cur,.m-fetch-curtain{visibility:visible}.m-fetch-cap{opacity:0}.m-fetch-curtain,.m-fetch-cur{animation:m-fetch-sweep 25.20s infinite}@keyframes m-fetch-c0{0%,2.78%{opacity:0}3.37%,15.67%{opacity:1}15.87%,100%{opacity:0}}.m-fetch-c0{animation:m-fetch-c0 25.20s infinite}@keyframes m-fetch-c1{0%,15.87%{opacity:0}16.47%,28.77%{opacity:1}28.97%,100%{opacity:0}}.m-fetch-c1{animation:m-fetch-c1 25.20s infinite}@keyframes m-fetch-c2{0%,28.97%{opacit