</text><path d='M627.33 174.0L630.33 167H647.06L650.06 174.0L647.06 181H630.33Z' fill='#161a1d' stroke='#e68db3'/><path d='M650.06 174.0L653.06 167H828.9L831.9 174.0L828.9 181H653.06Z' fill='#161a1d' stroke='#e68db3'/><text x='656.06' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>DATA</text><path d='M831.9 174.0L834.9 167H851.63L854.63 174.0L851.63 181H834.9Z' fill='#161a1d' stroke='#e68db3'/><path d='M854.63 174.0L857.63 167H863L866 174.0L863 181H857.63Z' fill='#161a1d' stroke='#e68db3'/><line x1='150' y1='210' x2='866' y2='210' stroke='#2c3337' stroke-width='.5'/><text x='16' y='202' fill='#9aa3a7' font-size='12'>imem_rvalid</text><path d='M150 205H627.33L627.33 191H638.7L638.7 205H831.9L831.9 191H843.27L843.27 205H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='234' x2='866' y2='234' stroke='#2c3337' stroke-width='.5'/><text x='16' y='226' fill='#9aa3a7' font-size='12'>imem_rdata</text><rect x='150' y='216' width='477.33' height='12' fill='#5b656a'/><path d='M627.33 222.0L630.33 215H635.7L638.7 222.0L635.7 229H630.33Z' fill='#161a1d' stroke='#3fc49b'/><rect x='638.7' y='216' width='193.21' height='12' fill='#5b656a'/><path d='M831.9 222.0L834.9 215H840.27L843.27 222.0L840.27 229H834.9Z' fill='#161a1d' stroke='#3fc49b'/><rect x='843.27' y='216' width='22.73' height='12' fill='#5b656a'/><line x1='150' y1='258' x2='866' y2='258' stroke='#2c3337' stroke-width='.5'/><text x='16' y='250' fill='#9aa3a7' font-size='12'>core state</text><path d='M150 246.0L153 239H635.7L638.7 246.0L635.7 253H153Z' fill='#161a1d' stroke='#e68db3'/><text x='156' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>FETCH</text><path d='M638.7 246.0L641.7 239H647.06L650.06 246.0L647.06 253H641.7Z' fill='#161a1d' stroke='#e68db3'/><path d='M650.06 246.0L653.06 239H737.98L740.98 246.0L737.98 253H653.06Z' fill='#161a1d' stroke='#e68db3'/><text x='656.06' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>PASS</text><path d='M740.98 246.0L743.98 239H840.27L843.27 246.0L840.27 253H743.98Z' fill='#161a1d' stroke='#e68db3'/><text x='746.98' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>FETCH</text><path d='M843.27 246.0L846.27 239H863L866 246.0L863 253H846.27Z' fill='#161a1d' stroke='#e68db3'/><rect class='m-fetch-curtain' visibility='hidden' x='150' y='60' width='732' height='214' fill='#0f1214'/><line class='m-fetch-cur' visibility='hidden' x1='150' y1='60' x2='150' y2='258' stroke='#ff7d47' stroke-width='2'/><rect x='0' y='280' width='880' height='84' rx='12' fill='#161a1d'/><rect x='0' y='280' width='880' height='12' fill='#161a1d'/><text class='m-fetch-sum' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Two instruction fetches at the pins: one with a full address preamble, one streamed. Watch the byte order: least</tspan><tspan x='16' dy='18'>significant byte first, high nibble first.</tspan></text><text class='m-fetch-cap m-fetch-c0' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>A fetch from a new address: chip select falls and the controller sends 8 nibbles, address bits 23..0 and the mode byte</tspan><tspan x='16' dy='18'>0xA0, which keeps the flash in continuous read.</tspan></text><text class='m-fetch-cap m-fetch-c1' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Four dummy clocks: the flash turns the bus around. uio_oe drops, so the SD pins become inputs.</tspan></text><text class='m-fetch-cap m-fetch-c2' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Eight data nibbles in. RV32 is little endian and the flash streams ascending addresses, so the first byte on the wire</tspan><tspan x='16' dy='18'>is the least significant; within a byte the high nibble comes first: b 7 0 2 0 0 3 0 is 0x300002b7.</tspan></text><text class='m-fetch-cap m-fetch-c3' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>imem_rvalid: 0x300002b7 (lui x5, 0x30000) reaches the core.</tspan></text><text class='m-fetch-cap m-fetch-c4' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The next fetch is sequential, so chip select stayed low and there is no preamble at all: the flash simply clocks out</tspan><tspan x='16' dy='18'>the next word, 8 nibbles instead of 20. This is the streaming that makes straight-line code fast.</tspan></text><text class='m-fetch-cap m-fetch-c5' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>0x00800313 (addi x6, x0, 8) delivered, 17 clocks after its data phase began.</tspan></text></svg>
