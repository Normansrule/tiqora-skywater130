<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 364' width='880' height='364' role='img' aria-labelledby='m-unmapped-t m-unmapped-d' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title id='m-unmapped-t'>An address with nothing behind it</title><desc id='m-unmapped-d'>A load from an unmapped address reads 0 at once, a store there is dropped, and a jump there fetches the all-zero word, which raises ILLEGAL. The test that records this also found that ui_in[2:0] must be 0 while reset is held. Recorded from an RTL simulation, not computed in the browser. Made by docs/tools/motion.py from docs/site/data/traces/unmapped.json.</desc><style>@keyframes m-unmapped-sweep{0.00%{transform:translateX(0.0px);animation-timing-function:ease-in-out}3.20%{transform:translateX(4.8px)}15.07%{transform:translateX(4.8px);animation-timing-function:ease-in-out}18.26%{transform:translateX(347.6px)}30.14%{transform:translateX(347.6px);animation-timing-function:ease-in-out}33.33%{transform:translateX(606.5px)}45.21%{transform:translateX(606.5px);animation-timing-function:ease-in-out}48.40%{transform:translateX(633.3px)}60.27%{transform:translateX(633.3px);animation-timing-function:ease-in-out}63.47%{transform:translateX(706.5px)}75.34%{transform:translateX(706.5px);animation-timing-function:ease-in-out}81.74%{transform:translateX(716.0px)}99.6%{transform:translateX(716.0px)}100%{transform:translateX(0)}}@media (prefers-reduced-motion:no-preference){.m-unmapped-sum{visibility:hidden}.m-unmapped-cap,.m-unmapped-cur,.m-unmapped-curtain{visibility:visible}.m-unmapped-cap{opacity:0}.m-unmapped-curtain,.m-unmapped-cur{animation:m-unmapped-sweep 21.90s infinite}@keyframes m-unmapped-c0{0%,3.20%{opacity:0}3.88%,18.04%{opacity:1}18.26%,100%{opacity:0}}.m-unmapped-c0{animation:m-unmapped-c0 21.90s infinite}@keyframes m-unmapped-c1{0%,18.26%{opacity:0}18.95%,33.11%{opacity:1}33.33%,100%{opacity:0}}.m-unmapped-c1{animation:m-unmapped-c1 21.90s infinite}@keyframes m-unmapped-c2{0%,33.33%{opacity:0}34.02%,48.17%{opacity:1}48.40%,100%{opacity:0}}.m-unmapped-c2{animation:m-unmapped-c2 21.90s infinite}@keyframes m-unmapped-c3{0%,48.40%{opacity:0}49.09%,63.24%{opacity:1}63.47%,100%{opacity:0}}.m-unmapped-c3{animation:m-unmapped-c3 21.90s infinite}@keyframes m-unmapped-c4{0%,63.47%{opacity:0}64.16%,99.77%{opacity:1}100.00%,100%{opacity:0}}.m-unmapped-c4{animation:m-unmapped-c4 21.90s infinite}}</style><rect width='880' height='364' rx='12' fill='#0f1214'/><text x='16' y='26' fill='#e8ebe9' font-size='16' font-weight='700'>An address with nothing behind it</text><text x='16' y='46' fill='#9aa3a7' font-size='12'>cycles 1521 to 1921 · 8.02 µs at 50 MHz</text><rect x='672.4' y='12' width='193.6' height='20' rx='10' fill='none' stroke='#6ea8f0'/><text x='769.2' y='26' text-anchor='middle' fill='#6ea8f0' font-size='11'>Recorded from RTL simulation</text><line x1='150' y1='90' x2='866' y2='90' stroke='#2c3337' stroke-width='.5'/><text x='16' y='82' fill='#9aa3a7' font-size='12'>core state</text><path d='M150 78.0L153 71H402.33L405.33 78.0L402.33 85H153Z' fill='#161a1d' stroke='#e68db3'/><text x='156' y='82' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>FETCH</text><rect x='405.33' y='71' width='1.79' height='14' fill='#e68db3' opacity='.35'/><path d='M407.12 78.0L410.12 71H418.4L421.4 78.0L418.4 85H410.12Z' fill='#161a1d' stroke='#e68db3'/><path d='M421.4 78.0L424.4 71H434.47L437.47 78.0L434.47 85H424.4Z' fill='#161a1d' stroke='#e68db3'/><path d='M437.47 78.0L440.47 71H446.97L449.97 78.0L446.97 85H440.47Z' fill='#161a1d' stroke='#e68db3'/><path d='M449.97 78.0L452.97 71H461.25L464.25 78.0L461.25 85H452.97Z' fill='#161a1d' stroke='#e68db3'/><path d='M464.25 78.0L467.25 71H466.61L469.61 78.0L466.61 85H467.25Z' fill='#161a1d' stroke='#e68db3'/><path d='M469.61 78.0L472.61 71H475.54L478.54 78.0L475.54 85H472.61Z' fill='#161a1d' stroke='#e68db3'/><path d='M478.54 78.0L481.54 71H489.82L492.82 78.0L4