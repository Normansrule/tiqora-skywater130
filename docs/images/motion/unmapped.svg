0L153 167H418.4L421.4 174.0L418.4 181H153Z' fill='#161a1d' stroke='#3fc49b'/><text x='156' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0x00000000</text><path d='M421.4 174.0L424.4 167H461.25L464.25 174.0L461.25 181H424.4Z' fill='#161a1d' stroke='#3fc49b'/><text x='427.4' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0x0…</text><path d='M464.25 174.0L467.25 167H489.82L492.82 174.0L489.82 181H467.25Z' fill='#161a1d' stroke='#3fc49b'/><path d='M492.82 174.0L495.82 167H575.53L578.53 174.0L575.53 181H495.82Z' fill='#161a1d' stroke='#3fc49b'/><text x='498.82' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0x0000000C</text><path d='M578.53 174.0L581.53 167H746.94L749.94 174.0L746.94 181H581.53Z' fill='#161a1d' stroke='#3fc49b'/><text x='584.53' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0x00000010</text><rect x='749.94' y='167' width='1.79' height='14' fill='#3fc49b' opacity='.35'/><path d='M751.73 174.0L754.73 167H775.51L778.51 174.0L775.51 181H754.73Z' fill='#161a1d' stroke='#3fc49b'/><path d='M778.51 174.0L781.51 167H804.08L807.08 174.0L804.08 181H781.51Z' fill='#161a1d' stroke='#3fc49b'/><path d='M807.08 174.0L810.08 167H832.65L835.65 174.0L832.65 181H810.08Z' fill='#161a1d' stroke='#3fc49b'/><path d='M835.65 174.0L838.65 167H848.72L851.72 174.0L848.72 181H838.65Z' fill='#161a1d' stroke='#3fc49b'/><path d='M851.72 174.0L854.72 167H863L866 174.0L863 181H854.72Z' fill='#161a1d' stroke='#3fc49b'/><line x1='150' y1='210' x2='866' y2='210' stroke='#2c3337' stroke-width='.5'/><text x='16' y='202' fill='#9aa3a7' font-size='12'>HALT (uo_out[5])</text><path d='M150 205H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='234' x2='866' y2='234' stroke='#2c3337' stroke-width='.5'/><text x='16' y='226' fill='#9aa3a7' font-size='12'>ILLEGAL (uo_out[6])</text><path d='M150 229H778.51L778.51 215H851.72L851.72 229H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='258' x2='866' y2='258' stroke='#2c3337' stroke-width='.5'/><text x='16' y='250' fill='#9aa3a7' font-size='12'>waking</text><path d='M150 239H324.98L324.98 253H851.72L851.72 239H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='492.82' y1='62' x2='492.82' y2='258' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='495.82' y='271' text-anchor='start' fill='#9aa3a7' font-size='11'>answered</text><line x1='778.51' y1='62' x2='778.51' y2='258' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='775.51' y='271' text-anchor='end' fill='#9aa3a7' font-size='11'>ILLEGAL</text><line x1='851.72' y1='62' x2='851.72' y2='258' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='848.72' y='271' text-anchor='end' fill='#9aa3a7' font-size='11'>reset</text><rect class='m-unmapped-curtain' visibility='hidden' x='150' y='60' width='732' height='214' fill='#0f1214'/><line class='m-unmapped-cur' visibility='hidden' x1='150' y1='60' x2='150' y2='258' stroke='#ff7d47' stroke-width='2'/><rect x='0' y='280' width='880' height='84' rx='12' fill='#161a1d'/><rect x='0' y='280' width='880' height='12' fill='#161a1d'/><text class='m-unmapped-sum' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>A load from an unmapped address reads 0 at once, a store there is dropped, and a jump there fetches the all-zero word,</tspan><tspan x='16' dy='18'>which raises ILLEGAL. The test that records this also found that ui_in[2:0] must be 0 while reset is held.</tspan></text><text class='m-unmapped-cap m-unmapped-c0' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>A second program, run from reset: point x1 at 0x50000000, load from it, store what came back to RAM A, then jump</tspan><tspan x='16' dy='18'>there. Device 5 does not exist on this chip.</tspan></text><text class='m-unmapped-cap m-unmapped-c1' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The load enters MEM with dmem_addr = 0x50000000. tp_bus sees that no device decodes it and answers at once with 0, so</tspan><tspan x='16' dy='18'>the core leaves MEM on the next clock.</tspan></text><text class='m-unmapped-cap m-unmapped-c2' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>jalr x0, 0(x1): the core fetches from 0x50000000. The bus answers this fetch at once too, with the all-zero word.</tspan></text><text class='m-unmapped-cap m-unmapped-c3' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>All zeros is not a RISC-V instruction, so ILLEGAL (uo_out[6]) rises and stays high. From the pins you can see that</tspan><tspan x='16' dy='18'>something went wrong; the chip keeps running.</tspan></text><text class='m-unmapped-cap m-unmapped-c4' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Reset clears ILLEGAL; the core returns to FETCH and the memory wake-up starts again.</tspan></text></svg>
