ity:1}12.58%,100%{opacity:0}}.m-deadline-c0{animation:m-deadline-c0 31.80s infinite}@keyframes m-deadline-c1{0%,12.58%{opacity:0}13.05%,22.80%{opacity:1}22.96%,100%{opacity:0}}.m-deadline-c1{animation:m-deadline-c1 31.80s infinite}@keyframes m-deadline-c2{0%,22.96%{opacity:0}23.43%,33.18%{opacity:1}33.33%,100%{opacity:0}}.m-deadline-c2{animation:m-deadline-c2 31.80s infinite}@keyframes m-deadline-c3{0%,33.33%{opacity:0}33.81%,43.55%{opacity:1}43.71%,100%{opacity:0}}.m-deadline-c3{animation:m-deadline-c3 31.80s infinite}@keyframes m-deadline-c4{0%,43.71%{opacity:0}44.18%,53.93%{opacity:1}54.09%,100%{opacity:0}}.m-deadline-c4{animation:m-deadline-c4 31.80s infinite}@keyframes m-deadline-c5{0%,54.09%{opacity:0}54.56%,64.31%{opacity:1}64.47%,100%{opacity:0}}.m-deadline-c5{animation:m-deadline-c5 31.80s infinite}@keyframes m-deadline-c6{0%,64.47%{opacity:0}64.94%,74.69%{opacity:1}74.84%,100%{opacity:0}}.m-deadline-c6{animation:m-deadline-c6 31.80s infinite}@keyframes m-deadline-c7{0%,74.84%{opacity:0}75.31%,99.84%{opacity:1}100.00%,100%{opacity:0}}.m-deadline-c7{animation:m-deadline-c7 31.80s infinite}}</style><rect width='880' height='340' rx='12' fill='#0f1214'/><text x='16' y='26' fill='#e8ebe9' font-size='16' font-weight='700'>A deadline fired on the exact tick</text><text x='16' y='46' fill='#9aa3a7' font-size='12'>cycles 295 to 560 · 5.32 µs at 50 MHz</text><rect x='672.4' y='12' width='193.6' height='20' rx='10' fill='none' stroke='#6ea8f0'/><text x='769.2' y='26' text-anchor='middle' fill='#6ea8f0' font-size='11'>Recorded from RTL simulation</text><line x1='150' y1='90' x2='866' y2='90' stroke='#2c3337' stroke-width='.5'/><text x='16' y='82' fill='#9aa3a7' font-size='12'>instruction</text><path d='M150 78.0L153 71H152.38L155.38 78.0L152.38 85H153Z' fill='#161a1d' stroke='#3fc49b'/><path d='M155.38 78.0L158.38 71H233.14L236.14 78.0L233.14 85H158.38Z' fill='#161a1d' stroke='#3fc49b'/><text x='161.38' y='82' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SF