e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>FETCH</text><path d='M236.14 102.0L239.14 95H246.59L249.59 102.0L246.59 109H239.14Z' fill='#161a1d' stroke='#e68db3'/><path d='M249.59 102.0L252.59 95H268.13L271.13 102.0L268.13 109H252.59Z' fill='#161a1d' stroke='#e68db3'/><rect x='271.13' y='95' width='2.69' height='14' fill='#e68db3' opacity='.35'/><path d='M273.82 102.0L276.82 95H289.66L292.66 102.0L289.66 109H276.82Z' fill='#161a1d' stroke='#e68db3'/><path d='M292.66 102.0L295.66 95H311.2L314.2 102.0L311.2 109H295.66Z' fill='#161a1d' stroke='#e68db3'/><rect x='314.2' y='95' width='2.69' height='14' fill='#e68db3' opacity='.35'/><path d='M316.89 102.0L319.89 95H332.73L335.73 102.0L332.73 109H319.89Z' fill='#161a1d' stroke='#e68db3'/><path d='M335.73 102.0L338.73 95H354.26L357.26 102.0L354.26 109H338.73Z' fill='#161a1d' stroke='#e68db3'/><path d='M357.26 102.0L360.26 95H362.34L365.34 102.0L362.34 109H360.26Z' fill='#161a1d' stroke='#e68db3'/><path d='M365.34 102.0L368.34 95H375.8L378.8 102.0L375.8 109H368.34Z' fill='#161a1d' stroke='#e68db3'/><path d='M378.8 102.0L381.8 95H397.33L400.33 102.0L397.33 109H381.8Z' fill='#161a1d' stroke='#e68db3'/><rect x='400.33' y='95' width='2.69' height='14' fill='#e68db3' opacity='.35'/><path d='M403.02 102.0L406.02 95H410.79L413.79 102.0L410.79 109H406.02Z' fill='#161a1d' stroke='#e68db3'/><path d='M413.79 102.0L416.79 95H418.86L421.86 102.0L418.86 109H416.79Z' fill='#161a1d' stroke='#e68db3'/><path d='M421.86 102.0L424.86 95H440.4L443.4 102.0L440.4 109H424.86Z' fill='#161a1d' stroke='#e68db3'/><rect x='443.4' y='95' width='2.69' height='14' fill='#e68db3' opacity='.35'/><path d='M446.09 102.0L449.09 95H809.17L812.17 102.0L809.17 109H449.09Z' fill='#161a1d' stroke='#e68db3'/><text x='452.09' y='106' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>TWAIT</text><rect x='812.17' y='95' width='2.69' height='14' fill='#e68db3' opacity='.35'/><path d='M814.86 102.0L817.86 95H828.01L831.01 102.0L828.01 109H817.86Z' fill='#161a1d' stroke='#e68db3'/><path d='M831.01 102.0L834.01 95H849.54L852.54 102.0L849.54 109H834.01Z' fill='#161a1d' stroke='#e68db3'/><path d='M852.54 102.0L855.54 95H860.31L863.31 102.0L860.31 109H855.54Z' fill='#161a1d' stroke='#e68db3'/><rect x='863.31' y='95' width='2.69' height='14' fill='#e68db3' opacity='.35'/><line x1='150' y1='138' x2='866' y2='138' stroke='#2c3337' stroke-width='.5'/><text x='16' y='130' fill='#9aa3a7' font-size='12'>UART TX (uo_out[4])</text><path d='M150 119H187.68L187.68 133H209.22L209.22 119H252.29L252.29 133H273.82L273.82 119H295.35L295.35 133H338.42L338.42 119H359.95L359.95 133H381.49L381.49 119H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='162' x2='866' y2='162' stroke='#2c3337' stroke-width='.5'/><text x='16' y='154' fill='#9aa3a7' font-size='12'>timebase</text><rect x='150' y='143' width='716' height='14' fill='#3fc49b' opacity='.35'/><text x='156' y='154' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0x0000012B … 0x00000234  (266 values)</text><line x1='150' y1='186' x2='866' y2='186' stroke='#2c3337' stroke-width='.5'/><text x='16' y='178' fill='#9aa3a7' font-size='12'>deadline 0</text><path d='M150 174.0L153 167H400.02L403.02 174.0L400.02 181H153Z' fill='#161a1d' stroke='#3fc49b'/><text x='156' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0x00000000</text><path d='M403.02 174.0L406.02 167H863L866 174.0L863 181H406.02Z' fill='#161a1d' stroke='#3fc49b'/><text x='409.02' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0x00000220</text><line x1='150' y1='210' x2='866' y2='210' stroke='#2c3337' stroke-width='.5'/><text x='16' y='202' fill='#9aa3a7' font-size='12'>armed 0</text><path d='M150 205H403.02L403.02 191H809.47L809.47 205H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='234' x2='866' y2='234' stroke='#2c3337' stroke-width='.5'/><text x='16' y='226' fill='#9aa3a7' font-size='12'>TRIG0 (uo_out[0])</text><path d='M150 229H809.47L809.47 215H831.01L831.01 229H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='809.47' y1='62' x2='809.47' y2='234' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='806.47' y='247' text-anchor='end' fill='#9aa3a7' font-size='11'>deadline tick</text><rect class='m-deadline-curtain' visibility='hidden' x='150' y='60' width='732' height='190' fill='#0f1214'/><line class='m-deadline-cur' visibility='hidden' x1='150' y1='60' x2='150' y2='234' stroke='#ff7d47' stroke-width='2'/><rect x='0' y='256' width='880' height='84' rx='12' fill='#161a1d'/><rect x='0' y='256' width='880' height='12' fill='#161a1d'/><text class='m-deadline-sum' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>TIME, TARM and TWAIT: the trigger pin lands on the programmed tick with no software in the path, while a UART byte</tspan><tspan x='16' dy='18'>goes out on its own.</tspan></text><text class='m-deadline-cap m-deadline-c0' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>sw x14, 0x0c(x5) writes &#x27;K&#x27; (0x4B) to UART_DATA. The timing tour set UART_DIV to 8 clocks per bit so the frame fits on</tspan><tspan x='16' dy='18'>screen; the reset value is 434.</tspan></text><text class='m-deadline-cap m-deadline-c1' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>uo_out[4] drops: the start bit. Then 8 data bits, least significant first: 1,1,0,1,0,0,1,0 for 0x4B, and a high stop</tspan><tspan x='16' dy='18'>bit. The core does not wait for it.</tspan></text><text class='m-deadline-cap m-deadline-c2' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>TIME x1 reads the timebase in its XP clock: 344. No bus access: the timing unit answers in the same clock.</tspan></text><text class='m-deadline-cap m-deadline-c3' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>tarm x1, x0 arms TRIG0 for tick 544 (the TIME value + 200).</tspan></text><text class='m-deadline-cap m-deadline-c4' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>twait x1: the deadline has not come, so the core parks in TWAIT. Nothing is fetched; the trigger needs no software.</tspan></text><text class='m-deadline-cap m-deadline-c5' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Tick 544: TRIG0 rises at the pin on exactly the deadline tick. The comparator fires one tick early because its output</tspan><tspan x='16' dy='18'>is registered, which puts the pin edge on the programmed tick.</tspan></text><text class='m-deadline-cap m-deadline-c6' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The core leaves TWAIT 1 clock after the deadline and fetches the next instruction.</tspan></text><text class='m-deadline-cap m-deadline-c7' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The next instruction starts its pass 8 clocks after the deadline: inside the 10 to 17 clocks that make latency</tspan><tspan x='16' dy='18'>measures over all eight rotation phases. The pin was exact; software resumes inside a window.</tspan></text></svg>
