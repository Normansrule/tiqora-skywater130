 fill='#5b656a'/><rect x='613.44' y='263' width='2.45' height='14' fill='#3fc49b' opacity='.35'/><rect x='615.89' y='264' width='76.01' height='12' fill='#5b656a'/><rect x='691.9' y='263' width='2.45' height='14' fill='#3fc49b' opacity='.35'/><rect x='694.36' y='264' width='171.64' height='12' fill='#5b656a'/><line x1='235.82' y1='62' x2='235.82' y2='282' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='238.82' y='295' text-anchor='start' fill='#9aa3a7' font-size='11'>overflow</text><rect class='m-capture-curtain' visibility='hidden' x='150' y='60' width='732' height='238' fill='#0f1214'/><line class='m-capture-cur' visibility='hidden' x1='150' y1='60' x2='150' y2='282' stroke='#ff7d47' stroke-width='2'/><rect x='0' y='304' width='880' height='84' rx='12' fill='#161a1d'/><rect x='0' y='304' width='880' height='12' fill='#161a1d'/><text class='m-capture-sum' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>An illegal instruction raises its pin and is skipped; then three edges arrive at a two-deep queue: two are kept in</tspan><tspan x='16' dy='18'>order with exact timestamps, the third is lost and OVF says so.</tspan></text><text class='m-capture-cap m-capture-c0' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The word 0x00000000 arrives. No RV32E or Xpulse instruction has opcode 0, so the core runs one pass without writing</tspan><tspan x='16' dy='18'>anything, latches ILLEGAL and moves on.</tspan></text><text class='m-capture-cap m-capture-c1' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>ILLEGAL (uo_out[6]) is high and stays high until reset. Execution continues with the next instruction.</tspan></text><text class='m-capture-cap m-capture-c2' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>ui_in[0] rises. Two synchronizer flip-flops later the edge is an event, stamped with the timebase.</tspan></text><text class='m-capture-cap m-capture-c3' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>ui_in[1] rises 4 clocks later: the second event, stamped exactly 4 ticks after the first.</tspan></text><text class='m-capture-cap m-capture-c4' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>ui_in[2] rises, but the queue is already full (2 of 2). This event is lost.</tspan></text><text class='m-capture-cap m-capture-c5' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>OVF (uo_out[3]) goes high and stays high: software can tell an event was dropped.</tspan></text><text class='m-capture-cap m-capture-c6' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>tpop x2: pin channel 0, rising, timestamp 1237.</tspan></text><text class='m-capture-cap m-capture-c7' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>tpop x3: pin channel 1, rising, timestamp 1241.</tspan></text><text class='m-capture-cap m-capture-c8' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>tpop x4: empty (0).</tspan></text><text class='m-capture-cap m-capture-c9' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>ecall: the core halts and raises HALT (uo_out[5]).</tspan></text></svg>
