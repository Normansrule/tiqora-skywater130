<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 340' width='880' height='340' role='img' aria-labelledby='m-stall-t m-stall-d' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title id='m-stall-t'>A stall, and the only recovery</title><desc id='m-stall-d'>A load from an unmapped address waits forever; only reset recovers. The test that records this also found that ui_in[2:0] must be 0 while reset is held. Recorded from an RTL simulation, not computed in the browser. Made by docs/tools/motion.py from docs/site/data/traces/stall.json.</desc><style>@keyframes m-stall-sweep{0.00%{transform:translateX(0.0px);animation-timing-function:ease-in-out}3.76%{transform:translateX(3.5px)}17.74%{transform:translateX(3.5px);animation-timing-function:ease-in-out}21.51%{transform:translateX(87.0px)}35.48%{transform:translateX(87.0px);animation-timing-function:ease-in-out}39.25%{transform:translateX(277.0px)}53.23%{transform:translateX(277.0px);animation-timing-function:ease-in-out}56.99%{transform:translateX(715.7px)}70.97%{transform:translateX(715.7px);animation-timing-function:ease-in-out}78.49%{transform:translateX(716.0px)}99.6%{transform:translateX(716.0px)}100%{transform:translateX(0)}}@media (prefers-reduced-motion:no-preference){.m-stall-sum{visibility:hidden}.m-stall-cap,.m-stall-cur,.m-stall-curtain{visibility:visible}.m-stall-cap{opacity:0}.m-stall-curtain,.m-stall-cur{animation:m-stall-sweep 18.60s infinite}@keyframes m-stall-c0{0%,3.76%{opacity:0}4.57%,21.24%{opacity:1}21.51%,100%{opacity:0}}.m-stall-c0{animation:m-stall-c0 18.60s infinite}@keyframes m-stall-c1{0%,21.51%{opacity:0}22.31%,38.98%{opacity:1}39.25%,100%{opacity:0}}.m-stall-c1{animation:m-stall-c1 18.60s infinite}@keyframes m-stall-c2{0%,39.25%{opacity:0}40.05%,56.72%{opacity:1}56.99%,100%{opacity:0}}.m-stall-c2{animation:m-stall-c2 18.60s infinite}@keyframes m-stall-c3{0%,56.99%{opacity:0}57.80%,99.73%{opacity:1}100.00%,100%{opacity:0}}.m-stall-c3{animation:m-stall-c3 18.60s infinite}}</style><rect width='880' height='340' rx='12' fill='#0f1214'/><text x='16' y='26' fill='#e8ebe9' font-size='16' font-weight='700'>A stall, and the only recovery</text><text x='16' y='46' fill='#9aa3a7' font-size='12'>cycles 1521 to 3028 · 30.16 µs at 50 MHz</text><rect x='672.4' y='12' width='193.6' height='20' rx='10' fill='none' stroke='#6ea8f0'/><text x='769.2' y='26' text-anchor='middle' fill='#6ea8f0' font-size='11'>Recorded from RTL simulation</text><line x1='150' y1='90' x2='866' y2='90' stroke='#2c3337' stroke-width='.5'/><text x='16' y='82' fill='#9aa3a7' font-size='12'>core state</text><path d='M150 78.0L153 71H214.9L217.9 78.0L214.9 85H153Z' fill='#161a1d' stroke='#e68db3'/><text x='156' y='82' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>FETCH</text><rect x='217.9' y='71' width='4.27' height='14' fill='#e68db3' opacity='.35'/><path d='M222.17 78.0L225.17 71H223.44L226.44 78.0L223.44 85H225.17Z' fill='#161a1d' stroke='#e68db3'/><rect x='226.44' y='71' width='7.12' height='14' fill='#e68db3' opacity='.35'/><path d='M233.56 78.0L236.56 71H859.2L862.2 78.0L859.2 85H236.56Z' fill='#161a1d' stroke='#e68db3'/><text x='239.56' y='82' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>MEM</text><rect x='862.2' y='71' width='3.8' height='14' fill='#e68db3' opacity='.35'/><line x1='150' y1='114' x2='866' y2='114' stroke='#2c3337' stroke-width='.5'/><text x='16' y='106' fill='#9aa3a7' font-size='12'>rst_n</text><path d='M150 95H862.2L862.2 95H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='138' x2='866' y2='138' stroke='#2c3337' stroke-width='.5'/><text x='16' y='130' fill='#9aa3a7' font-size='12'>dmem_req</text><path d='M150 133H233.56L233.56 119H862.2L862.2 133H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='162' x2='866' y2='162' stroke='#2c3337' stroke-width='.5'/><text x='16' y='154' fill='#9aa3a7' font-size='12'>dmem_addr</text><rect x='150' y='144' width='83.56' height='12' fill='#5b656a'/><path d='M233.56 150.0L236.56 143H859.2L862.2 150.0L859.2 157H236.56Z' fill='#161a1d' stroke='#3fc49b'/><text x='239.56' y='154' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0x50000000</text><rect x='862.2' y='143' width='3.8' height='14' fill='#3fc49b' opacity='.35'/><line x1='150' y1='186' x2='866' y2='186' stroke='#2c3337' stroke-width='.5'/><text x='16' y='178' fill='#9aa3a7' font-size='12'>HALT (uo_out[5])</text><path d='M150 181H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='210' x2='866' y2='210' stroke='#2c3337' stroke-width='.5'/><text x='16' y='202' fill='#9aa3a7' font-size='12'>ILLEGAL (uo_out[6])</text><path d='M150 205H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='234' x2='866' y2='234' stroke='#2c3337' stroke-width='.5'/><text x='16' y='226' fill='#9aa3a7' font-size='12'>waking</text><path d='M150 215H196.53L196.53 229H862.2L862.2 215H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='233.56' y1='62' x2='233.56' y2='234' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='236.56' y='247' text-anchor='start' fill='#9aa3a7' font-size='11'>stalled</text><line x1='862.2' y1='62' x2='862.2' y2='234' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='859.2' y='247' text-anchor='end' fill='#9aa3a7' font-size='11'>reset</text><rect class='m-stall-curtain' visibility='hidden' x='150' y='60' width='732' height='190' fill='#0f1214'/><line class='m-stall-cur' visibility='hidden' x1='150' y1='60' x2='150' y2='234' stroke='#ff7d47' stroke-width='2'/><rect x='0' y='256' width='880' height='84' rx='12' fill='#161a1d'/><rect x='0' y='256' width='880' height='12' fill='#161a1d'/><text class='m-stall-sum' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>A load from an unmapped address waits forever; only reset recovers. The test that records this also found that</tspan><tspan x='16' dy='18'>ui_in[2:0] must be 0 while reset is held.</tspan></text><text class='m-stall-cap m-stall-c0' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>A second program, run from reset: lui x1, 0x50000 then lw x2, 0(x1). Device 5 does not exist on this chip.</tspan></text><text class='m-stall-cap m-stall-c1' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The load enters MEM with dmem_addr = 0x50000000. tp_bus decodes devices 0 to 4 only, so nothing will ever answer.</tspan></text><text class='m-stall-cap m-stall-c2' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Still in MEM 400 clocks later. No HALT, no ILLEGAL: from the pins this looks like a chip that stopped. There is no bus</tspan><tspan x='16' dy='18'>timeout or bus-error trap in this design.</tspan></text><text class='m-stall-cap m-stall-c3' visibility='hidden' x='16' y='278' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Reset is the only way out: the core returns to FETCH and the memory wake-up starts again.</tspan></text></svg>
