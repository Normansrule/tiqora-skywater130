<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 460' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif'><title>Tiqora size comparison</title><rect width='1200' height='460' rx='16' fill='#0b0e14'/><text x='600' y='44' fill='#e9ecef' font-size='26' font-weight='700' text-anchor='middle'>How small is it?</text><text x='600' y='72' fill='#8b949e' font-size='15' text-anchor='middle'>everything drawn to the same scale · 100 µm = 100 px</text><rect x='90' y='164.24' width='508.76' height='225.76' fill='#1f2a44' stroke='#8a5cff' stroke-width='3'/><text x='344.38' y='277.12' fill='#e9ecef' font-size='17' font-weight='700' text-anchor='middle'>Tiqora</text><text x='344.38' y='299.12' fill='#8b949e' font-size='13' text-anchor='middle'>0.509 × 0.226 mm</text><text x='344.38' y='317.12' fill='#8b949e' font-size='13' text-anchor='middle'>≈ 6,000 logic cells</text><rect x='658.76' y='140' width='70.0' height='250' fill='#b08968' opacity='.85'/><text x='693.76' y='412' fill='#e9ecef' font-size='14' text-anchor='middle'>human hair</text><text x='693.76' y='430' fill='#8b949e' font-size='12' text-anchor='middle'>~70 µm wide</text><rect x='808.76' y='90.0' width='300.0' height='300.0' rx='14' fill='#e9ecef' opacity='.9' transform='rotate(-4 958.76 240.0)'/><text x='958.76' y='412' fill='#e9ecef' font-size='14' text-anchor='middle'>grain of table salt</text><text x='958.76' y='430' fill='#8b949e' font-size='12' text-anchor='middle'>~0.3 mm</text><circle cx='1168.76' cy='382' r='4.75' fill='#ff5d73'/><text x='1168.76' y='412' fill='#e9ecef' font-size='14' text-anchor='middle'>red blood cell</text><text x='1168.76' y='430' fill='#8b949e' font-size='12' text-anchor='middle'>~7.5 µm</text><line x1='90' y1='450' x2='190.0' y2='450' stroke='#e9ecef' stroke-width='3'/><text x='200.0' y='455' fill='#8b949e' font-size='13'>100 µm</text></svg>