# info.yaml — Tiny Tapeout project metadata for Tiqora.
# See https://tinytapeout.com for the current schema.
#
# `tiles: "3x2"`: at 2x2 the cells fit (48,763 um^2 in LibreLane 3.0.14's own
# synthesis with src/synth_exclude.cells) but the wiring does not: global
# routing needed 153% of the routing tracks. At 3x2 with placement density 50
# (src/config.json) a local run used 52% of the tracks and detailed routing
# reached 0 violations. (The earlier 32-bit core measured 69,866 um^2 and needed 4x2.)

project:
  title:        "Tiqora: RISC-V microcontroller with hardware timestamping"
  author:       "Aleksander Norman"
  discord:      ""
  description:  "Nibble-serial RV32E microcontroller: QSPI flash + RAM, UART, 8 GPIO in/out, and Xpulse instructions for 20 ns event timestamps and cycle-exact deadline triggers"
  language:     "SystemVerilog"
  clock_hz:     50000000            # 50 MHz signoff target; sweep in synthesis.
                                    # At 50 MHz: 21 clocks per sequential
                                    # instruction, 20 ns timestamp resolution.

  tiles:        "3x2"

  top_module:   "tt_um_normansrule_tiqora"

  # Package first, then leaves, then the modules that instantiate them.
  source_files:
    - "tp_pkg.sv"
    - "core/tp_nregfile.sv"
    - "core/tp_ncore.sv"
    - "sync/sync_timebase.sv"
    - "sync/sync_capture.sv"
    - "sync/sync_event_fifo.sv"
    - "sync/sync_compare.sv"
    - "sync/sync_unit.sv"
    - "periph/tp_uart.sv"
    - "periph/tp_periph.sv"
    - "boot/tp_bootrom.sv"
    - "bus/tp_bus.sv"
    - "bus/qspi_ctrl.sv"
    - "tp_soc.sv"
    - "tt_um_normansrule_tiqora.sv"

# Pin assignments. This text appears on the datasheet page.
pinout:
  ui[0]:  "IN0 / capture 0 / QSPI latency bit 0 during reset"
  ui[1]:  "IN1 / capture 1 / QSPI latency bit 1 during reset"
  ui[2]:  "IN2 / capture 2 / QSPI latency bit 2 during reset"
  ui[3]:  "UART RX / capture 3"
  ui[4]:  "IN4 / capture 4"
  ui[5]:  "IN5 / capture 5"
  ui[6]:  "IN6 / capture 6"
  ui[7]:  "IN7 / capture 7 / BOOT: high during reset runs the UART bootloader"

  uo[0]:  "TRIG0 deadline trigger / GPIO OUT0"
  uo[1]:  "TRIG1 deadline trigger / GPIO OUT1"
  uo[2]:  "EVT event waiting / GPIO OUT2"
  uo[3]:  "OVF event queue overflow / GPIO OUT3"
  uo[4]:  "UART TX / GPIO OUT4"
  uo[5]:  "HALT / GPIO OUT5"
  uo[6]:  "ILLEGAL instruction / GPIO OUT6"
  uo[7]:  "HEARTBEAT / GPIO OUT7"

  uio[0]: "QSPI CS0 flash"
  uio[1]: "QSPI SD0 / MOSI"
  uio[2]: "QSPI SD1 / MISO"
  uio[3]: "QSPI SCK"
  uio[4]: "QSPI SD2"
  uio[5]: "QSPI SD3"
  uio[6]: "QSPI CS1 RAM A"
  uio[7]: "QSPI CS2 RAM B"

# Do not change unless you know what you are doing.
yaml_version: 6
